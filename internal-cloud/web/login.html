<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 자재센터 불용자재 환입차량 예약시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --login-navy: #0a2342;
      --login-navy-mid: #0f3560;
      --signup-accent: #1e6fd9;
      --input-bg: #f4f6f9;
      --kepco-blue: #004795;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #e8ecf2;
      color: #1e293b;
    }
    .signup-topbar {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .signup-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }
    .signup-brand:hover { opacity: 0.9; color: inherit; }
    .signup-brand img { height: 32px; }
    .signup-brand span {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--kepco-blue);
      letter-spacing: -0.02em;
    }
    .signup-nav {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .signup-nav a {
      color: #64748b;
      text-decoration: none;
    }
    .signup-nav a:hover { color: var(--kepco-blue); }
    .signup-nav a.is-active {
      color: var(--kepco-blue);
      border-bottom: 2px solid var(--kepco-blue);
      padding-bottom: 2px;
    }
    .login-wrap {
      max-width: 960px;
      margin: 32px auto 48px;
      padding: 0 16px;
    }
    .login-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      min-height: 420px;
      background: #fff;
    }
    @media (max-width: 768px) {
      .login-card { grid-template-columns: 1fr; min-height: 0; }
    }
    .login-hero {
      background: linear-gradient(155deg, var(--login-navy) 0%, var(--login-navy-mid) 100%);
      color: #fff;
      padding: 40px 32px;
      position: relative;
      overflow: hidden;
    }
    .login-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('assets/main-img.jpg') center / cover no-repeat;
      opacity: 0.2;
      mix-blend-mode: luminosity;
    }
    .login-hero-inner { position: relative; z-index: 1; }
    .login-hero h2 {
      font-size: 1.45rem;
      font-weight: 800;
      margin: 0 0 12px;
      letter-spacing: -0.03em;
    }
    .login-hero p {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.6;
      opacity: 0.92;
    }
    .login-form-panel { padding: 40px 36px 36px; }
    @media (max-width: 576px) {
      .login-form-panel { padding: 28px 20px; }
    }
    .login-form-panel h1 {
      font-size: 1.45rem;
      font-weight: 800;
      margin: 0 0 8px;
      color: #0f172a;
    }
    .login-form-panel .subtitle {
      font-size: 0.88rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    .signup-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 6px;
    }
    .signup-input {
      width: 100%;
      border: 1px solid #e2e8f0;
      background: var(--input-bg);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.95rem;
    }
    .signup-input:focus {
      outline: none;
      border-color: var(--signup-accent);
      box-shadow: 0 0 0 3px rgba(30, 111, 217, 0.15);
      background: #fff;
    }
    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 13px 20px;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, #0f3560 0%, var(--login-navy) 100%);
      color: #fff;
    }
    .btn-login:hover:not(:disabled) { color: #fff; opacity: 0.95; }
    .btn-login:disabled { opacity: 0.55; }
    .login-footer-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.88rem;
      color: #64748b;
    }
    .login-footer-link a {
      font-weight: 700;
      color: var(--kepco-blue);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="signup-topbar">
    <a class="signup-brand" href="index.html">
      <img src="https://lh3.googleusercontent.com/d/196cwAcdh72FSYj38Lj5g9mS2rSZ12vXQ" alt="KEPCO">
      <span>자재센터 불용자재 환입차량 예약시스템</span>
    </a>
    <nav class="signup-nav" aria-label="계정">
      <a href="login.html" class="is-active">로그인</a>
      <a href="signup.html">회원가입</a>
    </nav>
  </header>

  <div class="login-wrap">
    <div class="login-card">
      <aside class="login-hero">
        <div class="login-hero-inner">
          <h2>환영합니다</h2>
          <p>가입 시 등록한 이메일과 비밀번호로 로그인한 뒤 예약 신청을 진행할 수 있습니다.</p>
        </div>
      </aside>
      <div class="login-form-panel">
        <h1>로그인</h1>
        <p class="subtitle">이메일을 아이디로 사용합니다.</p>
        <form id="loginForm">
          <div class="mb-3">
            <label class="signup-label" for="email">이메일</label>
            <input class="signup-input" type="email" id="email" required autocomplete="email" placeholder="name@company.com">
          </div>
          <div class="mb-3">
            <label class="signup-label" for="password">비밀번호</label>
            <input class="signup-input" type="password" id="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn-login" id="btnLogin">로그인</button>
        </form>
        <p class="login-footer-link">
          계정이 없으신가요? <a href="signup.html">회원가입</a>
        </p>
      </div>
    </div>
  </div>

  <script src="mvrs-api-client.js"></script>
  <script src="config.js"></script>
  <script>
    (function () {
      var sbClient = null;
      function getSupabase() {
        if (!sbClient) {
          if (typeof MVRS_API_BASE === 'undefined' && typeof window.MVRS_API_BASE === 'undefined') {
            throw new Error('config.js를 확인해 주세요. MVRS_API_BASE가 필요합니다.');
          }
          sbClient = window.supabase.createClient('', '');
        }
        return sbClient;
      }

      document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var email = (document.getElementById('email').value || '').trim();
        var password = document.getElementById('password').value || '';
        var btn = document.getElementById('btnLogin');
        btn.disabled = true;
        try {
          var sb = getSupabase();
          var res = await sb.auth.signInWithPassword({ email: email, password: password });
          if (res.error) {
            alert(res.error.message || '로그인에 실패했습니다.');
            btn.disabled = false;
            return;
          }
          var nextParam = '';
          try {
            nextParam = new URLSearchParams(window.location.search).get('next') || '';
          } catch (e) { /* ignore */ }
          var dest = nextParam
            ? new URL(nextParam, window.location.href).href
            : new URL('index.html', window.location.href).href;
          window.location.replace(dest);
        } catch (err) {
          console.warn(err);
          alert('로그인 처리 중 오류가 발생했습니다.');
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
